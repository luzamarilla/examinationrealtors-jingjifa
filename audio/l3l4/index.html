<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法複習音檔｜L3+L4</title>
<style>
  :root{
    --ink:#1e293b; --sub:#64748b; --line:#e2e8f0;
    --accent:#8B4438; --accent-bg:#f1e2dd; --bg:#f8fafc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
    padding:24px 18px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:22px; font-weight:900; margin:0 0 6px;}
  .subtitle{font-size:13.5px; color:var(--sub); margin-bottom:24px; line-height:1.6;}
  .track{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:18px;
  }
  .track-title{font-size:16px; font-weight:800; margin-bottom:4px;}
  .track-meta{font-size:12.5px; color:var(--sub); margin-bottom:12px;}
  audio{width:100%;}
  .dl{
    display:inline-block; margin-top:10px; font-size:13px;
    color:var(--accent); text-decoration:none; font-weight:700;
  }
  .badge{
    display:inline-block; background:var(--accent-bg); color:var(--accent);
    font-size:11.5px; font-weight:800; border-radius:8px; padding:2px 9px; margin-bottom:10px;
  }
  footer{text-align:center; font-size:12px; color:var(--sub); margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">經紀法・複習版・音檔</div>
  <h1>經紀法複習音檔｜L3+L4 公平交易法</h1>
  <div class="subtitle">依考古題出現頻率排序，第一段最高頻＋高頻，第二段中頻＋補充重點，通勤分段聽。聲音：曉雨（台灣腔）。</div>

  <div class="track">
    <div class="track-title">第一段｜最高頻＋高頻考點</div>
    <div class="track-meta">約 10 分鐘</div>
    <audio controls preload="none" src="part1.mp3"></audio>
    <br><a class="dl" href="part1.mp3" download>下載到手機 ↓</a>
  </div>

  <div class="track">
    <div class="track-title">第二段｜中頻＋補充重點</div>
    <div class="track-meta">約 7 分鐘</div>
    <audio controls preload="none" src="part2.mp3"></audio>
    <br><a class="dl" href="part2.mp3" download>下載到手機 ↓</a>
  </div>

  <footer>經紀法複習版｜L3+L4 公平交易法｜音檔版</footer>
</div>
</body>
</html>
